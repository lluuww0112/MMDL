# Default configuration for eval/qwen/mmmu.py.
# Qwen3-VL Instruct MMMU recipe:
# https://github.com/QwenLM/Qwen3-VL/tree/main/evaluation/mmmu
model:
  path: Qwen/Qwen3-VL-4B-Instruct
  revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  loader: model.model_loader:load_qwen3_vl
  device: cuda:0
  # false keeps all model weights on the single `device` above.
  device_map: false
  dtype: bf16

evaluation:
  batch_size: 1
  num_processes: 1
  main_process_port: 12346

generation:
  # Official Qwen3-VL Instruct sampling recipe.
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 1.5
  seed: 3407
  max_new_tokens: 32768

image:
  # Qwen visual-token range: 256 to 1280 patches at 28x28 pixels each.
  min_pixels: 200704
  max_pixels: 1003520
