# Default configuration for eval/qwen/mmmu.py.
# Qwen3-VL Instruct MMMU recipe:
# https://github.com/QwenLM/Qwen3-VL/tree/main/evaluation/mmmu
model:
  path: Qwen/Qwen3-VL-4B-Instruct
  revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  loader: model.model_loader:load_qwen3_vl
  device: cuda:0
  device_map: false # false keeps all model weights on the single `device` above.
  vllm_gpu_utilization: 0.8 # Used with `--backend vllm`; reserve this fraction of each visible GPU.
  max_model_len: 32768 # vLLM's KV-cache allocation for a single Colab GPU.
  dtype: bf16

evaluation:
  revision: 98e6ac0cb9b7b2cd2c991b85a50762edc4aedc68 # Pinned MMMU dataset revision.
  batch_size: 1
  num_processes: 1
  main_process_port: 12346

generation:
  # Official Qwen3-VL Instruct sampling recipe.
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 1.5
  seed: 42
  max_new_tokens: 32768 # official 32768

prompt: # Fixed presets are defined in model/conversation.py.
  conversation: qwen3_vl_mmmu

image:
  # Official Qwen3-VL MMMU recipe: 1280 to 5120 patches at 28x28 pixels each.
  min_pixels: 1003520
  max_pixels: 4014080
