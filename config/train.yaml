# Single-image COCONUT sample format:
# [{"image": "relative/path.jpg", "question": str, "answer": str, "steps": [str, ...]}]
# min_pixels/max_pixels are read from the qwen.yaml argument to train/run.sh.
history_dir: ./history
history:
  # null starts and completes stage 0 only.  Loading a previous run directory
  # automatically resumes its incomplete stage or trains the next completed stage.
  load_checkpoint: null # Checkpoint file or previous run directory, relative to history_dir.
  save_name: qwen3-vl-coconut-kradapter # New run directory under history_dir.
seed: 42

model:
  path: Qwen/Qwen3-VL-4B-Instruct
  revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  dtype: bf16
  attn_implementation: sdpa

adapter:
  type: kradapter
  scaling: 2 # Official KRAdapter default; internal dimensions are inferred from each base Linear layer.
  target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  train_path: null # Required before training.
  val_path: null   # Optional teacher-forced validation loss.
  conversation: qwen3_vl_mmmu # Same user prompt preset as eval/qwen/mmmu.py.
  max_train_samples: null
  max_val_samples: null

coconut:
  enabled: true
  c_thought: 2
  max_latent_stage: 4
  epochs_per_stage: 1
  pad_latent_to_max: false

training:
  optimizer: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  num_workers: 0
  save_every_epochs: 1
