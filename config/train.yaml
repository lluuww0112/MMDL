# Single-image COCONUT sample format:
# [{"image": "relative/path.jpg", "question": str, "original_answer": str,
#   "answer": str, "steps": [str, ...]}]
# min_pixels/max_pixels are read from the training Qwen YAML passed to train/run.sh.
history_dir: ./history
history:
  # null starts and completes stage 0 only.  Loading a previous run directory
  # automatically resumes its incomplete stage or trains the next completed stage.
  load_checkpoint: test # Checkpoint file or previous run directory, relative to history_dir.
  save_name: test1 # New run directory under history_dir.
seed: 42 # Model/training seed. `data.sample_seed` controls reproducible dataset sampling.

model:
  path: Qwen/Qwen3-VL-4B-Instruct
  revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  dtype: bf16
  attn_implementation: sdpa

adapter:
  type: kradapter
  scaling: 2 # Official KRAdapter default; internal dimensions are inferred from each base Linear layer.
  target_modules: [k_proj, v_proj]

data:
  # Loaded from the local Hugging Face cache configured by $HF_HOME (hf_cache).
  train_path: hf://OpenDataArena/MMFineReason-SFT-123K-Qwen3-VL-235B-Thinking
  val_path: null   # Optional teacher-forced validation loss.
  # Randomly sample this many valid rows from hf_cache; null uses every row.
  max_train_samples: 1
  sample_seed: 42
  min_len: 64
  max_val_samples: null

coconut:
  enabled: true
  c_thought: 1
  max_latent_stage: 4
  epochs_per_stage: 1
  pad_latent_to_max: false

training:
  optimizer: adamw
  lr: 1e-4
  weight_decay: 0.01
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  # Recompute selected forward activations during backward to lower peak VRAM.
  gradient_checkpointing: true
  num_workers: 0
  save_every_epochs: 1
